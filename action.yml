name: Send artifacts to AppVeyor Artifacts Receiver
description: >
  Discover artifacts from the current GitHub Actions run and notify an
  AppVeyorArtifactsReceiver webhook so they can be mirrored locally.
author: nefarius

branding:
  icon: package
  color: blue

inputs:
  webhook-url:
    description: >
      Receiver webhook URL (for example https://ci.example.org/webhooks/<guid>).
      Store this as a repository secret; do not commit it.
    required: true
  github-token:
    description: >
      GitHub token used to list artifacts and forwarded to the receiver as
      X-GitHub-Token so archive_download_url values can be fetched. The calling
      job needs actions: read.
    required: true
  artifact-name:
    description: >
      If set, only the artifact with this exact name is sent. When omitted,
      every non-expired artifact from the current workflow run is sent.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Discover artifacts and notify receiver
      uses: actions/github-script@v9
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const webhookUrl = (process.env.WEBHOOK_URL || '').trim();
          const token = (process.env.INPUT_GITHUB_TOKEN || '').trim();
          const artifactNameFilter = (process.env.ARTIFACT_NAME || '').trim();

          if (!webhookUrl) {
            core.setFailed('Input webhook-url is required.');
            return;
          }

          if (!token) {
            core.setFailed('Input github-token is required.');
            return;
          }

          const { owner, repo } = context.repo;
          const runId = context.runId;

          const artifacts = await github.paginate(
            github.rest.actions.listWorkflowRunArtifacts,
            {
              owner,
              repo,
              run_id: runId,
              per_page: 100
            },
            (response) => Array.isArray(response.data)
              ? response.data
              : (response.data?.artifacts ?? [])
          );

          const available = artifacts.filter((artifact) => !artifact.expired);
          const selected = artifactNameFilter
            ? available.filter((artifact) => artifact.name === artifactNameFilter)
            : available;

          if (selected.length === 0) {
            if (artifactNameFilter) {
              core.setFailed(
                `No non-expired artifact named "${artifactNameFilter}" was found in run ${runId}. Upload it before calling this action.`
              );
            } else {
              core.setFailed(
                `No non-expired artifacts were found for run ${runId}. Upload artifacts before calling this action.`
              );
            }
            return;
          }

          const missingUrl = selected.find((artifact) => !artifact.archive_download_url);
          if (missingUrl) {
            core.setFailed(
              `Artifact "${missingUrl.name}" has no archive_download_url. Confirm the token has actions: read.`
            );
            return;
          }

          const repositoryName = context.payload.repository?.name || repo;
          const repositoryFullName =
            process.env.GITHUB_REPOSITORY || `${owner}/${repo}`;

          const payload = {
            artifacts: selected.map((artifact) => ({
              fileName: `${artifact.name}.zip`,
              url: artifact.archive_download_url
            })),
            environmentVariables: {
              // AppVeyor-compatible aliases for existing templates.
              appveyor_project_name: repositoryName,
              appveyor_repo_branch: process.env.GITHUB_REF_NAME || '',
              appveyor_build_version: process.env.GITHUB_REF_NAME || '',
              // Native GitHub placeholders. Prefer these for unique paths.
              github_repository_owner: owner,
              github_repository_name: repositoryName,
              github_repository: repositoryFullName,
              github_ref: process.env.GITHUB_REF || '',
              github_ref_name: process.env.GITHUB_REF_NAME || '',
              github_ref_type: process.env.GITHUB_REF_TYPE || '',
              github_sha: process.env.GITHUB_SHA || context.sha || '',
              github_workflow: process.env.GITHUB_WORKFLOW || context.workflow || '',
              github_event_name: process.env.GITHUB_EVENT_NAME || context.eventName || '',
              github_actor: process.env.GITHUB_ACTOR || context.actor || '',
              github_run_id: String(context.runId ?? process.env.GITHUB_RUN_ID ?? ''),
              github_run_number: String(context.runNumber ?? process.env.GITHUB_RUN_NUMBER ?? ''),
              github_run_attempt: String(process.env.GITHUB_RUN_ATTEMPT || '')
            }
          };

          core.info(
            `Sending ${payload.artifacts.length} artifact(s) from run ${runId}: ${selected.map((artifact) => artifact.name).join(', ')}`
          );

          let response;
          try {
            response = await fetch(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-GitHub-Token': token
              },
              body: JSON.stringify(payload)
            });
          } catch (error) {
            const detail = error.cause?.code || error.name || 'network error';
            core.setFailed(`Failed to reach the artifacts receiver (${detail}).`);
            return;
          }

          const body = (await response.text()).trim();
          if (!response.ok) {
            const snippet = body ? body.slice(0, 200) : 'empty body';
            core.setFailed(
              `Artifacts receiver returned HTTP ${response.status} ${response.statusText}: ${snippet}`
            );
            return;
          }

          core.info(`Artifacts receiver accepted the webhook (HTTP ${response.status}).`);
